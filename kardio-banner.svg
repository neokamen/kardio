<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Kardio - the Plasma monitor</title>
  <desc id="d">Banner de Kardio: icono de dial con pulso cardíaco a la izquierda y el texto Kardio, the Plasma monitor a su derecha, el conjunto centrado.</desc>

  <!-- Fondo -->
  <rect width="1280" height="640" fill="#101a24"/>

  <!-- Cuadrícula de monitor, muy tenue (simétrica respecto al centro) -->
  <g stroke="#3daee9" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 40H1280M0 120H1280M0 200H1280M0 280H1280M0 360H1280M0 440H1280M0 520H1280M0 600H1280"/>
    <path d="M40 0V640M120 0V640M200 0V640M280 0V640M360 0V640M440 0V640M520 0V640M600 0V640M680 0V640M760 0V640M840 0V640M920 0V640M1000 0V640M1080 0V640M1160 0V640M1240 0V640"/>
  </g>

  <!-- Línea de pulso: mitad izquierda y su espejo a la derecha -->
  <defs>
    <path id="ecg-half" d="M0,585 H160 l14,-14 l14,14 H330 l10,-40 l18,80 l14,-55 l8,15 H470 l14,-14 l14,14 H640"
          fill="none" stroke="#3daee9" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>
  <use xlink:href="#ecg-half" href="#ecg-half"/>
  <use xlink:href="#ecg-half" href="#ecg-half" transform="translate(1280,0) scale(-1,1)"/>

  <!-- Icono a la izquierda: dial + pulso, centrado en el eje vertical del texto (y=290) -->
  <g>
    <circle cx="415" cy="290" r="100" fill="none" stroke="#223445" stroke-width="20"/>
    <circle cx="415" cy="290" r="100" fill="none" stroke="#3daee9" stroke-width="20" stroke-linecap="round"
            stroke-dasharray="471 157" transform="rotate(135 415 290)"/>
    <path d="M350,290 H383 l12,-6 l12,-44 l16,92 l14,-60 l8,18 H480"
          fill="none" stroke="#ff5d73" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Texto a la derecha del icono, alineado a la izquierda -->
  <text x="575" y="304" font-family="'Noto Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="124" font-weight="700" letter-spacing="-3" fill="#eef4f8">Kardio</text>
  <text x="580" y="366" font-family="'Noto Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="38" font-weight="400" fill="#3daee9">the Plasma monitor</text>
</svg>
